<meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Controle de Etiquetas e Lotes - V6</title>
<!-- V10: mantém a lógica estável de Pedidos/Item Pedido/SKU/Produto/Etiqueta/Prestador e melhora Pendentes.
     Pendentes agora mostra contexto de Startup por SKU e substitui a confirmação de um lote calculado por uma decisão:
     "Sem restrições de lote" ou "Lotes até [data]". A decisão é armazenada temporariamente em cr79e_lote.
     Choice Dataverse: 100000000 = Prestpack | 100000001 = LogCare. -->
<script>
  (function(){
  var API="/_api/";
  function isGuid(v){return typeof v==="string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);}
  function getToken(){return new Promise(function(resolve){window.shell.getTokenDeferred().done(resolve);});}
  function toDate(v){return v?v.slice(0,10):"";}
  async function fetchComRetry(url,options,tentativas){
  tentativas=tentativas||4;
  for(var t=0;t<tentativas;t++){
  var res;
  try{res=await fetch(url,options);}catch(networkErr){if(t<tentativas-1){await new Promise(function(r){setTimeout(r,400*(t+1));});continue;}throw networkErr;}
  if(res.status===429||res.status>=500){if(t<tentativas-1){await new Promise(function(r){setTimeout(r,400*(t+1));});continue;}return res;}
  if(res.status===400){var bodyText="";try{bodyText=await res.clone().text();}catch(e){}if(bodyText.indexOf("9004010A")>=0&&t<tentativas-1){await new Promise(function(r){setTimeout(r,400*(t+1));});continue;}}
  return res;
  }
  }
  function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
  var unidadesColumnAvailable=true;
  var MAPS={
  baseData:{table:"cr79e_basededadoses",idField:"cr79e_basededadosid",fields:{codigo:"cr79e_name",pais:"cr79e_pais",projeto:"cr79e_projeto",sku:"cr79e_sku",marca:"cr79e_marca",submarca:"cr79e_submarca",versao:"cr79e_versao",embalagem:"cr79e_embalagem",peso:"cr79e_peso",distribuidor:"cr79e_distribuidor",startup:"cr79e_startup",unidadesPorCaixa:"cr79e_unxcx"}},
  etiquetas:{table:"cr79e_etiquetas",idField:"cr79e_etiquetaid",fields:{sku:"cr79e_sku",pais:"cr79e_pais",distribuidor:"cr79e_distribuidor",observacoes:"cr79e_observacoes",dataStartup:"cr79e_startuo"},primaryField:"cr79e_sku"},
  registros:{table:"cr79e_registros",idField:"cr79e_registroid",fields:{numero:"cr79e_numero",pais:"cr79e_pais",sku:"cr79e_sku",validade:"cr79e_validade",observacoes:"cr79e_observacoes"}}
  };
  async function loadSimple(key){
  var map=MAPS[key];
  var headers={Accept:"application/json"};
  var selectFields=[map.idField];
  for(var k in map.fields){if(selectFields.indexOf(map.fields[k])<0)selectFields.push(map.fields[k]);}
  if(key==="baseData")selectFields=selectFields.filter(function(f){return f!=="cr79e_unxcx";});
  var url=API+map.table+"?$select="+encodeURIComponent(selectFields.join(","));
  var res=await fetch(url,{headers:headers});
  if(!res.ok){throw new Error("Falha ao carregar "+key+": "+res.status+" "+(await res.text()));}
  var json=await res.json();
  if(key==="baseData"&&(json.value||[]).length){
    var unitsRes=await fetch(API+map.table+"?$select="+encodeURIComponent(map.idField+",cr79e_unxcx"),{headers:headers});
    if(unitsRes.ok){
      var unitsJson=await unitsRes.json(),unitById={};
      (unitsJson.value||[]).forEach(function(row){unitById[row[map.idField]]=row.cr79e_unxcx;});
      (json.value||[]).forEach(function(row){row.cr79e_unxcx=unitById[row[map.idField]]??null;});
      unidadesColumnAvailable=true;
    }else{
      unidadesColumnAvailable=false;
      console.warn("Coluna Unxcx indisponível: "+unitsRes.status+" "+(await unitsRes.text()));
    }
  }
  return (json.value||[]).map(function(row){
  var obj={id:row[map.idField]};
  for(var jsKey in map.fields){
  var dv=map.fields[jsKey];
  obj[jsKey]=(dv.toLowerCase().indexOf("startup")>=0||dv.toLowerCase().indexOf("validade")>=0||dv.toLowerCase().indexOf("startuo")>=0)?toDate(row[dv]):(row[dv]??"");
  }
  return obj;
  });
  }
  async function saveSimple(key,localArray){
  var map=MAPS[key];
  var token=await getToken();
  var okCount=0,failCount=0,falhas=[];
  /*
     IMPORTANTE: esta função NÃO apaga registros que existem no Dataverse.
     Ela apenas cria novos registros ou atualiza os existentes.
     Assim, uma sessão antiga do navegador nunca poderá apagar dados válidos.
  */
  for(var j=0;j<localArray.length;j++){
  var item=localArray[j];
  var body={};
  for(var jsKey2 in map.fields){
  var dv2=map.fields[jsKey2];
  var value=item[jsKey2];
  if(value===undefined)value="";
  if(key==="baseData"&&jsKey2==="unidadesPorCaixa"){if(unidadesColumnAvailable)body[dv2]=(value===""||value===null)?null:Number(value);}
  else body[dv2]=value===null?null:value;
  }
  if(map.lookup){
  var lookupId=item[map.lookup.localKey];
  if(isGuid(lookupId)){
  var navName=item.lookupNavigationProperty||null;
  if(!navName)navName=await getEtiquetaProdutoNav();
  body[navName+"@odata.bind"]="/"+map.lookup.entitySet+"("+lookupId+")";
  }
  }
  try{
  if(isGuid(item.id)){
  var resPatch=await fetchComRetry(API+map.table+"("+item.id+")",{method:"PATCH",headers:{"__RequestVerificationToken":token,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!resPatch.ok){throw new Error(resPatch.status+" "+(await resPatch.text()));}
  }else{
  var res2=await fetchComRetry(API+map.table,{method:"POST",headers:{"__RequestVerificationToken":token,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(body)});
  if(!res2.ok){throw new Error(res2.status+" "+(await res2.text()));}
  var created=await res2.json();
  item.id=created[map.idField];
  }
  okCount++;
  }catch(e){
  failCount++;
  falhas.push({item:(item.codigo||item.sku||item.numero||"?"),erro:e.message});
  console.error("Falha ao salvar item",item,e);
  }
  await delay(100);
  }
  if(failCount>0){
  console.error("Itens que falharam ao salvar:",falhas);
  toast(failCount+" registro(s) nao foram salvos. "+okCount+" salvos com sucesso.");
  }
  return {ok:okCount,fail:failCount};
  }
  var itemPedidoLookupNavCache={};
  async function getItemPedidoLookupNav(lookupLogicalName){
  if(itemPedidoLookupNavCache[lookupLogicalName])return itemPedidoLookupNavCache[lookupLogicalName];
  var lookupValueName="_"+lookupLogicalName.toLowerCase()+"_value";

  /* 1) Melhor fonte: uma linha real do Dataverse com a anotacao
     associatednavigationproperty. Isso retorna exatamente a Navigation Property
     esperada pelo @odata.bind. */
  try{
  var sampleRes=await fetch(API+"cr79e_itempedidos?$select=_cr79e_pedido_value,_cr79e_produto_value&$top=50",{headers:{Accept:"application/json",Prefer:'odata.include-annotations="Microsoft.Dynamics.CRM.associatednavigationproperty"'}});
  if(sampleRes.ok){
  var sampleJson=await sampleRes.json();
  var samples=sampleJson.value||[];
  var ann=lookupValueName+"@Microsoft.Dynamics.CRM.associatednavigationproperty";
  for(var s=0;s<samples.length;s++){
  if(samples[s][ann]){
  itemPedidoLookupNavCache[lookupLogicalName]=samples[s][ann];
  console.log("[METADATA] Navigation Property por anotacao",lookupLogicalName,"=>",samples[s][ann]);
  return samples[s][ann];
  }
  }
  }
  }catch(e){console.warn("Nao foi possivel descobrir lookup por anotacao:",lookupLogicalName,e);}

  /* 2) Se ainda nao existir nenhuma linha com o lookup preenchido, consulta o
     CSDL e limita a busca ao EntityType cr79e_itempedido. O nome do
     relacionamento NAO e usado como Navigation Property. */
  try{
  var metaRes=await fetch(API+"$metadata",{headers:{Accept:"application/xml"}});
  if(metaRes.ok){
  var xmlText=await metaRes.text();
  var xml=new DOMParser().parseFromString(xmlText,"application/xml");
  var entityTypes=xml.getElementsByTagName("EntityType");
  for(var eidx=0;eidx<entityTypes.length;eidx++){
  var entityType=entityTypes[eidx];
  if((entityType.getAttribute("Name")||"").toLowerCase()!=="cr79e_itempedido")continue;
  var children=entityType.childNodes;
  for(var nidx=0;nidx<children.length;nidx++){
  var nav=children[nidx];
  if(!nav.localName||nav.localName!=="NavigationProperty")continue;
  var navName=nav.getAttribute("Name")||"";
  var constraints=nav.getElementsByTagName("ReferentialConstraint");
  for(var c=0;c<constraints.length;c++){
  var prop=(constraints[c].getAttribute("Property")||"").toLowerCase();
  if(prop===lookupLogicalName.toLowerCase()||prop===lookupValueName){
  if(navName){
  itemPedidoLookupNavCache[lookupLogicalName]=navName;
  console.log("[METADATA] Navigation Property por $metadata",lookupLogicalName,"=>",navName);
  return navName;
  }
  }
  }
  }
  }
  }
  }catch(e2){console.warn("Nao foi possivel descobrir lookup pelo metadata:",lookupLogicalName,e2);}

  /* 3) Fallback seguro: usa o Schema Name da coluna lookup, nao o nome do
     relacionamento. Pedido ja funcionava originalmente como cr79e_Pedido.
     Para o novo lookup Produto, o schema esperado e cr79e_Produto. */
  var safeFallback={cr79e_pedido:"cr79e_Pedido",cr79e_produto:"cr79e_Produto"};
  if(safeFallback[lookupLogicalName]){
  itemPedidoLookupNavCache[lookupLogicalName]=safeFallback[lookupLogicalName];
  console.warn("[METADATA] Usando fallback seguro para "+lookupLogicalName+": "+safeFallback[lookupLogicalName]);
  return safeFallback[lookupLogicalName];
  }
  throw new Error("Nao foi possivel descobrir a Navigation Property do lookup "+lookupLogicalName+" em Item pedido.");
  }

  if(!res.ok){var txt=await res.text();throw new Error(res.status+" "+txt);}
  var id=null;
  var entityHeader=res.headers.get("OData-EntityId")||res.headers.get("odata-entityid");
  if(entityHeader){var m=entityHeader.match(/\(([0-9a-fA-F-]{36})\)/);if(m)id=m[1];}
  var text="";try{text=await res.text();}catch(e){}
  if(text){try{var json=JSON.parse(text);for(var k in json){if(/id$/i.test(k)&&isGuid(json[k])){id=json[k];break;}}}catch(e2){}}
  return id;

  async function savePedidos(localArray){
  var token=await getToken();
  var failCount=0;var errors=[];
  for(var j=0;j<localArray.length;j++){
  var p=localArray[j];
  /* Pedidos que ja possuem GUID ja estao persistidos. Nao fazemos PATCH em todos os pedidos ao criar um novo. */
  if(isGuid(p.id))continue;
  var originalLocalId=p.id;
  var pedidoId=p.id;
  var createdItemIds=[];
  var body={"cr79e_numero":p.numero||"","cr79e_data":p.data||null,"cr79e_pais":p.pais||"","cr79e_distribuidor":p.distribuidor||null,"cr79e_observacoes":p.observacoes||""};
  if(p.prestadorServico!==""&&p.prestadorServico!==null&&p.prestadorServico!==undefined){body["cr79e_prestadordeservico"]=Number(p.prestadorServico);}
  try{
  var resPedido=await fetchComRetry(API+"cr79e_pedidos",{method:"POST",headers:{"__RequestVerificationToken":token,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"},body:JSON.stringify(body)});
  if(!resPedido.ok)throw new Error("POST Pedido falhou: "+resPedido.status+" "+(await resPedido.text()));
  var createdPedido=await resPedido.json();
  pedidoId=createdPedido["cr79e_pedidoid"];
  if(!isGuid(pedidoId))throw new Error("Dataverse criou o pedido, mas nao retornou um GUID valido.");
  p.id=pedidoId;
  var itensNovos=p.itens||[];
  for(var m=0;m<itensNovos.length;m++){
  var createdItemId=await createItemPedido(pedidoId,itensNovos[m],token);
  if(createdItemId)createdItemIds.push(createdItemId);
  await delay(80);
  }
  }catch(e){
  failCount++;errors.push("Pedido "+(p.numero||"?")+": "+e.message);console.error("Falha ao salvar pedido",p,e);
  if(isGuid(pedidoId)){
  try{
  for(var x=0;x<createdItemIds.length;x++){await fetchComRetry(API+"cr79e_itempedidos("+createdItemIds[x]+")",{method:"DELETE",headers:{"__RequestVerificationToken":token}});}
  await fetchComRetry(API+"cr79e_pedidos("+pedidoId+")",{method:"DELETE",headers:{"__RequestVerificationToken":token}});
  }catch(cleanErr){console.error("Falha ao desfazer pedido parcial",cleanErr);}
  p.id=originalLocalId;
  }
  }
  await delay(100);
  }
  if(failCount){throw new Error(errors.join(" | "));}
  return true;
  }

  async function sincronizarProjetosEtiquetasClick(){
  var btn=Q("#btn-sincronizar-projetos");
  var linhasNovas=[];var linhasAtualizar=[];var projetosNovos=[];var antigos=[];
  etiquetas.forEach(function(e){
  if(!e.observacoes||e.observacoes.indexOf("Projeto: ")!==0)return;
  var projetoDaEtiqueta=e.observacoes.slice("Projeto: ".length).trim();
  if(!projetoDaEtiqueta||!e.sku||!e.pais)return;
  var row=null;
  if(e.produtoId){for(var i=0;i<baseData.length;i++){if(baseData[i].id===e.produtoId){row=baseData[i];break;}}}
  if(!row){for(var j=0;j<baseData.length;j++){var r=baseData[j];if((r.sku||"")===(e.sku||"")&&(r.pais||"")===(e.pais||"")&&((r.distribuidor||"")===(e.distribuidor||""))){row=r;break;}}}
  if(!row){for(var k=0;k<linhasNovas.length;k++){var nr=linhasNovas[k];if(nr.sku===e.sku&&nr.pais===e.pais&&((nr.distribuidor||"")===(e.distribuidor||""))){row=nr;break;}}}
  if(!row){
  /* Etiqueta antiga cujo país nunca chegou a virar linha na Base de Dados
     (criada antes da correção). Recria a linha agora, usando qualquer outra
     linha do mesmo SKU como referência de marca/submarca/versão/embalagem/peso. */
  var refRow=null;
  for(var m=0;m<baseData.length;m++){if(baseData[m].sku===e.sku){refRow=baseData[m];break;}}
  if(!refRow){for(var m2=0;m2<linhasNovas.length;m2++){if(linhasNovas[m2].sku===e.sku){refRow=linhasNovas[m2];break;}}}
  if(!refRow)return;
  row={id:uid("db"),codigo:"",pais:e.pais,projeto:projetoDaEtiqueta,sku:e.sku,marca:refRow.marca,submarca:refRow.submarca,versao:refRow.versao,embalagem:refRow.embalagem,peso:refRow.peso,distribuidor:e.distribuidor||"",startup:e.dataStartup||refRow.startup||"",unidadesPorCaixa:refRow.unidadesPorCaixa||null};
  linhasNovas.push(row);
  return;
  }
  if(row.projeto!==projetoDaEtiqueta&&linhasAtualizar.indexOf(row)<0){
  linhasAtualizar.push(row);
  projetosNovos.push(projetoDaEtiqueta);
  antigos.push(row.projeto);
  }
  });
  if(!linhasNovas.length&&!linhasAtualizar.length){toast("Nenhuma divergência encontrada — a Base de Dados já reflete os projetos das etiquetas.");return;}
  if(btn){btn.disabled=true;var old=btn.textContent;btn.textContent="Sincronizando...";}
  var baseDataAntes=baseData.length;
  if(linhasNovas.length)baseData=baseData.concat(linhasNovas);
  linhasAtualizar.forEach(function(r,idx){r.projeto=projetosNovos[idx];});

  if(!ok){
  if(linhasNovas.length)baseData=baseData.slice(0,baseDataAntes);
  linhasAtualizar.forEach(function(r,idx){r.projeto=antigos[idx];});
  return;
  }
  render();
  var partes=[];
  if(linhasNovas.length)partes.push(linhasNovas.length+" registro(s) criado(s)");
  if(linhasAtualizar.length)partes.push(linhasAtualizar.length+" registro(s) atualizado(s)");
  toast("Base de Dados sincronizada: "+partes.join(", ")+".");
  }
  async function importarTabelaUnidadesPorCaixaClick(file){

  linhas.forEach(function(l){
  var sku=String(l.sku||"").trim().toUpperCase();
  var raw=String(l.unidadesPorCaixa??"").trim();

  if(!atualizacoes.length){toast("Nenhum SKU do arquivo foi encontrado na Base de Dados.");return;}
  if(btn){btn.disabled=true;btn.textContent="Importando...";}
  var count=await window.__appBackend.updateUnidadesPorCaixaRows(atualizacoes);
  baseData.forEach(function(r){var sku=String(r.sku||"").trim().toUpperCase();if(Object.prototype.hasOwnProperty.call(porSku,sku))r.unidadesPorCaixa=porSku[sku];});
  render();
  var ausentes=validos.filter(function(sku){return !baseData.some(function(r){return String(r.sku||"").trim().toUpperCase()===sku;});});
  toast(count+" linha(s) atualizada(s) por SKU."+(ausentes.length?" "+ausentes.length+" SKU(s) não encontrado(s).":""));
  }catch(err){console.error(err);toast("Falha na importação: "+err.message);}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent="Importar tabela de Unidades por Caixa";}}
  };
  reader.onerror=function(){toast("Não foi possível ler o arquivo.");};
  reader.readAsArrayBuffer(file);
  }

  async function salvarLoteEtiquetasClick(){
  var btn=Q("#modal-save-lote");
  var projeto=(Q("#lote-projeto-nome").value||"").trim();
  if(!projeto){toast("Informe o nome do projeto.");return;}
  var keys=Object.keys(loteEtiquetasState.produtos);
  if(!keys.length){toast("Selecione ao menos um produto.");return;}
  var novasEtiquetas=[];var erros=[];var duplicadas=0;var novasLinhasBaseData=[];var linhasBaseDataParaAtualizar=[];
  keys.forEach(function(key){
  var entry=loteEtiquetasState.produtos[key];
  var p=entry.product;
  if(!entry.linhas.length){erros.push(p.sku+": nenhuma linha de país adicionada.");return;}
  entry.linhas.forEach(function(linha){
  if(!linha.pais){erros.push(p.sku+": selecione o país.");return;}
  if(!linha.dataStartup){erros.push(p.sku+" ("+linha.pais+"): informe a data de startup.");return;}
  var baseRow=null;
  for(var i=0;i<baseData.length;i++){
  var r=baseData[i];
  if(r.sku===p.sku&&r.pais===linha.pais&&((r.distribuidor||"")===(linha.distribuidor||""))){baseRow=r;break;}
  }
  if(!baseRow){
  for(var ni=0;ni<novasLinhasBaseData.length;ni++){
  var nr=novasLinhasBaseData[ni];
  if(nr.sku===p.sku&&nr.pais===linha.pais&&((nr.distribuidor||"")===(linha.distribuidor||""))){baseRow=nr;break;}
  }
  }
  /* Para montar nome/marca/submarca/versão/embalagem/peso usamos qualquer linha
     existente do mesmo SKU como referência (esses dados são iguais entre países). */
  var refRow=baseRow;
  if(!refRow){
  for(var ri=0;ri<baseData.length;ri++){if(baseData[ri].sku===p.sku){refRow=baseData[ri];break;}}
  }
  if(!refRow){erros.push(p.sku+": produto não encontrado na Base de Dados.");return;}
  if(!baseRow){
  /* País/distribuidor novo para este SKU: cria a linha correspondente na Base
     de Dados também, para que a etiqueta em lote fique refletida lá. O Código
     Webcenter fica em branco, pois é específico de cada país e ainda não existe. */
  baseRow={id:uid("db"),codigo:"",pais:linha.pais,projeto:projeto,sku:refRow.sku,marca:refRow.marca,submarca:refRow.submarca,versao:refRow.versao,embalagem:refRow.embalagem,peso:refRow.peso,distribuidor:linha.distribuidor||"",startup:linha.dataStartup,unidadesPorCaixa:refRow.unidadesPorCaixa||null};
  novasLinhasBaseData.push(baseRow);
  }else if(baseRow.projeto!==projeto&&linhasBaseDataParaAtualizar.indexOf(baseRow)<0){
  /* País/distribuidor já existia na Base de Dados: o registro em si não muda de
     produto, mas o campo Projeto precisa passar a refletir o projeto deste lote,
     senão a linha nunca aparece ao buscar/filtrar por esse projeto. */
  linhasBaseDataParaAtualizar.push(baseRow);
  }
  var pk=productKeyOf(refRow);
  var nk=nodeKeyOf(pk,linha.pais,linha.distribuidor||null);
  var nome=[baseRow.codigo,projeto,linha.pais,refRow.marca,(refRow.submarca&&refRow.submarca!=="-")?refRow.submarca:"",refRow.versao,refRow.embalagem,refRow.peso,refRow.sku,linha.distribuidor||""].filter(function(x){return !!x;}).join(" ");
  var jaExiste=etiquetas.some(function(e){return e.nodeKey===nk&&e.dataStartup===linha.dataStartup&&e.nomeEtiqueta===nome;});
  if(jaExiste){duplicadas++;return;}
  novasEtiquetas.push({id:uid("etq"),source:"manual",nodeKey:nk,productKey:pk,produtoId:baseRow.id,sku:refRow.sku,pais:linha.pais,distribuidor:linha.distribuidor||null,nomeEtiqueta:nome,dataStartup:linha.dataStartup,observacoes:"Projeto: "+projeto,criadoEm:new Date().toISOString()});
  });
  });
  if(erros.length){toast(erros.slice(0,3).join(" | ")+(erros.length>3?" (+"+(erros.length-3)+" outro(s))":""));return;}
  if(!novasEtiquetas.length){toast(duplicadas?"Todas as etiquetas informadas já existem.":"Nenhuma etiqueta para salvar.");return;}
  if(totalRecords()+novasEtiquetas.length>999){toast("Limite de 999 registros seria ultrapassado.");return;}
  btn.disabled=true;var old=btn.textContent;btn.textContent="Salvando...";
  var baseDataAntes=baseData.length;
  var projetosAntigos=linhasBaseDataParaAtualizar.map(function(r){return r.projeto;});
  var precisaSalvarBaseData=novasLinhasBaseData.length>0||linhasBaseDataParaAtualizar.length>0;
  if(novasLinhasBaseData.length)baseData=baseData.concat(novasLinhasBaseData);
  linhasBaseDataParaAtualizar.forEach(function(r){r.projeto=projeto;});
  if(precisaSalvarBaseData){
  var okBase=await saveBaseData();
  if(!okBase){
  if(novasLinhasBaseData.length)baseData=baseData.slice(0,baseDataAntes);
  linhasBaseDataParaAtualizar.forEach(function(r,idx){r.projeto=projetosAntigos[idx];});
  btn.disabled=false;btn.textContent=old;
  return;
  }
  }
  var antes=etiquetas.length;
  etiquetas=etiquetas.concat(novasEtiquetas);
  var ok=await safeSet("etiquetas",etiquetas);
  if(!ok){
  etiquetas=etiquetas.slice(0,antes);
  if(novasLinhasBaseData.length)baseData=baseData.slice(0,baseDataAntes);
  linhasBaseDataParaAtualizar.forEach(function(r,idx){r.projeto=projetosAntigos[idx];});
  btn.disabled=false;btn.textContent=old;
  return;
  }
  closeModal();render();
  var atualizacoesMsg=(novasLinhasBaseData.length||linhasBaseDataParaAtualizar.length)?", Base de Dados: "+(novasLinhasBaseData.length?novasLinhasBaseData.length+" novo(s)":"")+(novasLinhasBaseData.length&&linhasBaseDataParaAtualizar.length?" e ":"")+(linhasBaseDataParaAtualizar.length?linhasBaseDataParaAtualizar.length+" atualizado(s)":""):"";
  toast(novasEtiquetas.length+" etiqueta(s) criada(s)"+atualizacoesMsg+(duplicadas?", "+duplicadas+" já existente(s) ignorada(s)":"")+".");
  }

  function findRegistro(productKey,pais){for(var i=0;i<registros.length;i++){if(registros[i].productKey===productKey&&registros[i].pais===pais)return registros[i];}return null;}
  function registroStatus(reg){if(!reg||!reg.validade)return null;return reg.validade>=TODAY?"vigente":"vencido";}
  function applyRegistroFiltros(products){
  var f=registroFiltros;
  return products.filter(function(p){
  if(f.marca&&p.marca!==f.marca)return false;
  if(f.submarca&&p.submarca!==f.submarca)return false;
  if(f.versao&&p.versao!==f.versao)return false;
  if(f.embalagem&&p.embalagem!==f.embalagem)return false;
  if(f.peso&&p.peso!==f.peso)return false;
  if(f.sku&&p.sku!==f.sku)return false;
  if(f.pais&&!p.rows.some(function(r){return r.pais===f.pais;}))return false;
  if(f.projeto&&!p.rows.some(function(r){return r.projeto===f.projeto;}))return false;
  if(f.distribuidor&&!p.rows.some(function(r){return (r.distribuidor||"")===f.distribuidor;}))return false;
  if(f.status){
  var paisesDoProduto=uniqueArr(p.rows.map(function(r){return r.pais;}));
  var algumBate=paisesDoProduto.some(function(pais){var reg=findRegistro(p.key,pais);if(f.status==="sem")return !reg;return registroStatus(reg)===f.status;});
  if(!algumBate)return false;
  }
  return true;
  });
  }

  function lerTextoComDeteccaoDeCodificacao(file){
  return new Promise(function(resolve,reject){
  var reader=new FileReader();
  reader.onerror=function(){reject(new Error("Não foi possível ler o arquivo."));};
  reader.onload=function(ev){
  var texto=ev.target.result;
  if(texto.indexOf("\uFFFD")>=0){
  var reader2=new FileReader();
  reader2.onerror=function(){reject(new Error("Não foi possível ler o arquivo."));};
  reader2.onload=function(ev2){resolve(ev2.target.result);};
  reader2.readAsText(file,"ISO-8859-1");
  }else{
  resolve(texto);
  }
  };
  reader.readAsText(file,"UTF-8");
  });
  }
  function detectarDelimitadorCsv(text){
  var firstLine=(text.split(/\r\n|\r|\n/)[0])||"";
  var candidatos=[";",",","\t"];
  var melhor=";";var melhorContagem=-1;
  candidatos.forEach(function(d){
  var contagem=firstLine.split(d).length-1;
  if(contagem>melhorContagem){melhorContagem=contagem;melhor=d;}
  });
  return melhor;
  }
  async function processarImportacaoProdutosRegistros(rows){

  registrosAtualizados++;

  async function handleImportRegistrosFileChange(file){
  if(!file)return;
  var isCsv=/\.csv$/i.test(file.name);
  var isXlsx=/\.xlsx$/i.test(file.name);
  if(!isCsv&&!isXlsx){toast("Envie um arquivo .csv ou .xlsx.");return;}
  try{
  var rows;
  if(isCsv){
  var texto=await lerTextoComDeteccaoDeCodificacao(file);
  var delim=detectarDelimitadorCsv(texto);
  if(typeof Papa==="undefined"){toast("Não foi possível carregar o leitor de CSV.");return;}
  var resultado=Papa.parse(texto,{delimiter:delim,skipEmptyLines:true});
  rows=resultado.data||[];
  }else{
  var arrayBuffer=await file.arrayBuffer();
  var wb=XLSX.read(arrayBuffer,{type:"array",cellDates:true});
  var ws=wb.Sheets[wb.SheetNames[0]];
  rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  }
  await processarImportacaoProdutosRegistros(rows);
  }catch(err){console.error(err);toast("Não foi possível ler o arquivo: "+err.message);}
  }

  function daysBetweenIso(a,b){
  if(!a||!b)return null;
  var da=new Date(a+"T00:00:00"),db=new Date(b+"T00:00:00");
  if(isNaN(da.getTime())||isNaN(db.getTime()))return null;
  return Math.round((db-da)/86400000);
  }
  function calendarDurationIso(fromIso,toIso){
  if(!fromIso||!toIso)return null;
  var a=new Date(fromIso+"T00:00:00"),b=new Date(toIso+"T00:00:00");
  if(isNaN(a.getTime())||isNaN(b.getTime()))return null;
  var future=b<a;
  var start=future?b:a,end=future?a:b;
  var years=end.getFullYear()-start.getFullYear();
  var months=end.getMonth()-start.getMonth();
  var days=end.getDate()-start.getDate();
  if(days<0){
  months--;
  var prevMonthLastDay=new Date(end.getFullYear(),end.getMonth(),0).getDate();
  days+=prevMonthLastDay;
  }
  if(months<0){years--;months+=12;}
  return{years:years,months:months,days:days,future:future};
  }
  function durationTextIso(fromIso,toIso){
  var d=calendarDurationIso(fromIso,toIso);
  if(!d)return "";
  var parts=[];
  if(d.years)parts.push(d.years+" "+(d.years===1?"ano":"anos"));
  if(d.months)parts.push(d.months+" "+(d.months===1?"mês":"meses"));
  if(!d.years&&d.days)parts.push(d.days+" "+(d.days===1?"dia":"dias"));
  if(!parts.length)parts.push("hoje");
  var text=parts.slice(0,2).join(" e ");
  return d.future?"em "+text:(text==="hoje"?"hoje":"há "+text);
  }
  function relativeTimeFromPedido(pedidoIso,eventIso){
  if(!pedidoIso||!eventIso)return "";
  var pedido=new Date(pedidoIso+"T00:00:00"),evento=new Date(eventIso+"T00:00:00");
  if(isNaN(pedido.getTime())||isNaN(evento.getTime()))return "";
  if(pedido.getTime()===evento.getTime())return "hoje";
  var d=calendarDurationIso(pedidoIso,eventIso);
  if(!d)return "";
  var parts=[];
  if(d.years)parts.push(d.years+" "+(d.years===1?"ano":"anos"));
  if(d.months)parts.push(d.months+" "+(d.months===1?"mês":"meses"));
  if(!d.years&&d.days)parts.push(d.days+" "+(d.days===1?"dia":"dias"));
  if(!parts.length)return "hoje";
  var text=parts.slice(0,2).join(" e ");
  return evento>pedido?"em "+text:"há "+text;
  }

  function addMonthsIso(iso,months){
  if(!iso)return "";
  var p=iso.split("-");if(p.length!==3)return "";
  var y=Number(p[0]),m=Number(p[1])-1,d=Number(p[2]);
  var target=new Date(Date.UTC(y,m+months,1));
  var last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();
  target.setUTCDate(Math.min(d,last));
  return target.toISOString().slice(0,10);
  }
  function addDaysIso(iso,days){
  if(!iso)return "";
  var d=new Date(iso+"T00:00:00Z");
  if(isNaN(d.getTime()))return "";
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
  }
  function etiquetaOptionsForPedidoRow(p,r){
  if(!r.baseRow)return[];
  var pk=productKeyOf(r.baseRow);
  var nk=nodeKeyOf(pk,p.pais,p.distribuidor||null);
  var pedidoDate=p.data||"";
  var pedidoDist=(p.distribuidor||"").trim();

  /* REGRA DE SEGURANCA DA FAMILIA DA ETIQUETA
     Nunca mistura distribuidores. O historico elegivel pertence obrigatoriamente
     ao mesmo produto + pais + distribuidor do pedido. */
  var list=etiquetas.filter(function(e){
    if(!e.dataStartup)return false;
    if((e.sku||"")!==(r.sku||""))return false;
    if((e.pais||"")!==(p.pais||""))return false;
    if(((e.distribuidor||"").trim())!==pedidoDist)return false;

    /* Quando os links hidratados existem, exige tambem a mesma familia de produto. */
    if(e.productKey&&e.productKey!==pk)return false;
    if(e.nodeKey&&e.nodeKey!==nk)return false;
    return true;
  }).slice().sort(function(a,b){return (a.dataStartup||"").localeCompare(b.dataStartup||"");});

  /* Remove duplicatas sem relaxar pais/distribuidor/produto. */
  var famSeen={};
  list=list.filter(function(e){
    var k=(e.nomeEtiqueta||"")+"|"+(e.dataStartup||"");
    if(famSeen[k])return false;
    famSeen[k]=true;
    return true;
  });

  var currentName=r.etiquetaVigente&&r.etiquetaVigente.nomeEtiqueta?r.etiquetaVigente.nomeEtiqueta:"";
  var historyLimit=addDaysIso(addMonthsIso(pedidoDate,-8),-10); /* 8 meses e 10 dias antes */
  var futureLimit=addMonthsIso(pedidoDate,2);                   /* 2 meses depois */
  var chosen=[];

  var currentIndex=-1;
  for(var i=0;i<list.length;i++){
    if((list[i].nomeEtiqueta||"")===currentName){currentIndex=i;break;}
  }

  /* Se a etiqueta salva nao foi localizada pelo nome, tenta localizar pelo Startup
     correspondente a vigente na data do pedido, mas somente dentro da familia estrita. */
  if(currentIndex<0){
    for(var j=0;j<list.length;j++){
      if(list[j].dataStartup<=pedidoDate)currentIndex=j;else break;
    }
  }

  function pushOption(e,isCurrent,kind){
    if(!e||!e.nomeEtiqueta)return;
    chosen.push({
      nomeEtiqueta:e.nomeEtiqueta,
      dataStartup:e.dataStartup||"",
      isCurrent:!!isCurrent,
      isFuture:(e.dataStartup||"")>pedidoDate,
      kind:kind||""
    });
  }

  var current=currentIndex>=0?list[currentIndex]:null;
  if(current)pushOption(current,true,"current");
  else if(currentName)chosen.push({nomeEtiqueta:currentName,dataStartup:"",isCurrent:true,isFuture:false,kind:"current"});

  /* 1) ETIQUETA MAIS RECENTE JA VIGENTE NA DATA DO PEDIDO.
     Se o item estiver apontando para uma etiqueta antiga, oferece a mais recente
     do MESMO produto/pais/distribuidor, independentemente da idade da etiqueta atual. */
  var latestPastIndex=-1;
  for(var lp=0;lp<list.length;lp++){
    if(list[lp].dataStartup<=pedidoDate)latestPastIndex=lp;else break;
  }
  if(latestPastIndex>=0&&latestPastIndex!==currentIndex){
    pushOption(list[latestPastIndex],false,"latest");
  }

  /* 2) ETIQUETA IMEDIATAMENTE ANTERIOR.
     Quando o Startup da etiqueta selecionada ocorreu ha no maximo 8 meses e 10 dias,
     permite conferir a etiqueta imediatamente anterior da mesma familia. */
  if(current&&currentIndex>0&&current.dataStartup>=historyLimit&&current.dataStartup<=pedidoDate){
    pushOption(list[currentIndex-1],false,"previous");
  }

  /* 3) PROXIMO STARTUP.
     Permite selecionar a primeira etiqueta futura da mesma familia quando o Startup
     ocorrer em ate 2 meses depois da data do pedido. */
  for(var nx=0;nx<list.length;nx++){
    if(list[nx].dataStartup>pedidoDate&&list[nx].dataStartup<=futureLimit){
      pushOption(list[nx],false,"next");
      break;
    }
  }

  var seen={};
  chosen=chosen.filter(function(x){
    var key=x.nomeEtiqueta+"|"+x.dataStartup;
    if(seen[key])return false;
    seen[key]=true;
    return true;
  });
  chosen.sort(function(a,b){
    var order={current:0,latest:1,previous:2,next:3};
    return (order[a.kind]===undefined?9:order[a.kind])-(order[b.kind]===undefined?9:order[b.kind]);
  });
  return chosen;
  }

  if(o.dataStartup){suffix.push(formatDateBR(o.dataStartup));var rel=relativeTimeFromPedido(p.data,o.dataStartup);if(rel)suffix.push(rel);}
  return o.nomeEtiqueta+(suffix.length?" — "+suffix.join(" · "):"");
